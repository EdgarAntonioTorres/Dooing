version: '3.8'

services:
  mongodb:
    image: mongo:5
    container_name: todoing_mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: mongoadmin
      MONGO_INITDB_ROOT_PASSWORD: "123456"
      MONGO_INITDB_DATABASE: todo_app
    volumes:
      - mongodb_data:/data/db
      - ./init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro
    networks:
      - todoing_network

  web:
    image: tony127/todoing:latest
    container_name: todoing_php
    restart: always
    ports:
      - "8080:80"
    depends_on:
      - mongodb
    environment:
      MONGODB_HOST: mongodb
      MONGODB_PORT: "27017"
      MONGODB_USER: mongoadmin
      MONGODB_PASSWORD: "123456"
      MONGODB_DATABASE: todo_app
      MONGODB_AUTH_SOURCE: admin
    networks:
      - todoing_network

  watchtower:
    image: containrrr/watchtower
    container_name: watchtower
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: --interval 300 --cleanup todoing_php
    networks:
      - todoing_network

volumes:
  mongodb_data:

networks:
  todoing_network:
    driver: bridge